name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - Makefile
      - "src/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new release instead of verifying only
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    uses: oh-my-infra/brew-ci/.github/workflows/source-release.yml@dcb81d939fd62b8ce35f529ec7d321e85c34bf45
    with:
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      runner: macos-26
      project-name: omcli
      validate-command: make build && sh tests/test.sh
      package-paths: |
        VERSION
        LICENSE
        LICENSE-APACHE
        NOTICE
        README.md
        Makefile
        src
        tests
